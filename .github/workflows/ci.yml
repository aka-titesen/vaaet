# ─────────────────────────────────────────────────────────────
# VAAET — Pipeline de Integración Continua
# Se activa en cada push y pull request a main.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision,training,visualization,database,dev]"

      - name: Verificar dependencias e imports
        run: |
          pip check
          python -c "import cv2, imblearn, joblib, numpy, pandas, psycopg2, sklearn, sqlalchemy, tensorflow, ultralytics"

      - name: Ejecutar Ruff
        run: ruff check src tests scripts migrations

      - name: Compilar módulos Python
        run: python -m compileall -q src tests scripts migrations

      - name: Ejecutar tests unitarios, contractuales y de repositorio
        run: pytest -v --tb=short -x -m "not postgres"

      - name: Verificar compilación de notebooks
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for nb in pathlib.Path('notebooks').rglob('*.ipynb'):
              import json
              cells = json.loads(nb.read_text(encoding='utf-8'))['cells']
              for i, cell in enumerate(cells):
                  if cell['cell_type'] == 'code':
                      src = ''.join(cell['source'])
                      try:
                          ast.parse(src)
                      except SyntaxError as e:
                          errors.append(f'{nb}:cell {i}: {e}')
          if errors:
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los notebooks compilan correctamente')
          "

      - name: Rechazar binarios ML versionados por Git
        run: |
          python -c "
          import pathlib, subprocess, sys
          forbidden = {'.pt', '.keras', '.joblib', '.h5'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in tracked if pathlib.Path(p).suffix.lower() in forbidden]
          print('Binarios ML versionados:', bad)
          sys.exit(bool(bad))
          "

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar enlaces internos en documentación
        run: |
          python -c "
          import pathlib, re, sys
          errors = []
          root = pathlib.Path('.')
          for md in root.rglob('*.md'):
              normalized = md.as_posix()
              if '.git' in normalized or 'plantillas_docs' in normalized:
                  continue
              content = md.read_text(encoding='utf-8', errors='replace')
              links = re.findall(r'\[.*?\]\((?!http)(.*?)\)', content)
              for link in links:
                  clean = link.split('#')[0].split('?')[0]
                  if not clean:
                      continue
                  target = (md.parent / clean).resolve()
                  if not target.exists():
                      errors.append(f'{md}: enlace roto → {clean}')
          if errors:
              print('Enlaces rotos encontrados:')
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los enlaces internos son válidos')
          "

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vaaet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaaet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VAAET_DATABASE_ADMIN_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/vaaet
      VAAET_EXPECT_LEGACY_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de base de datos
        run: pip install -e ".[database,dev]"

      - name: Aplicar migración y roles
        run: |
          python -c "import os, pathlib, psycopg2; c=psycopg2.connect(os.environ['VAAET_DATABASE_ADMIN_URL'].replace('postgresql+psycopg2://','postgresql://')); c.autocommit=True; c.cursor().execute(pathlib.Path('tests/fixtures/postgres-legacy.sql').read_text()); c.close()"
          alembic upgrade head
          python -c "import os, pathlib, psycopg2; c=psycopg2.connect(os.environ['VAAET_DATABASE_ADMIN_URL'].replace('postgresql+psycopg2://','postgresql://')); c.autocommit=True; c.cursor().execute(pathlib.Path('migrations/provision-roles.sql').read_text()); c.close()"

      - name: Probar schema, constraints y mínimo privilegio
        run: pytest tests/integration -v --tb=short -m postgres

      - name: Auditar PostgreSQL sin mutaciones
        env:
          VAAET_DB_HOST: localhost
          VAAET_DB_PORT: "5432"
          VAAET_DB_NAME: vaaet
          VAAET_DB_SSLMODE: disable
          VAAET_TRAINING_DB_USER: postgres
          VAAET_TRAINING_DB_PASSWORD: postgres
        run: |
          python scripts/audit-postgres-database.py --output /tmp/postgres-audit.json
          python -c "import json; r=json.load(open('/tmp/postgres-audit.json')); assert r['alembic_revision']=='20260806_0002'; assert r['integrity']['automatic_accident_states']==0"

      - name: Probar migración desde base vacía
        run: |
          python -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:postgres@localhost:5432/vaaet'); c.autocommit=True; c.cursor().execute('CREATE DATABASE vaaet_fresh'); c.close()"
          VAAET_DATABASE_ADMIN_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/vaaet_fresh alembic upgrade head
          VAAET_DATABASE_ADMIN_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/vaaet_fresh python -c "import os, pathlib, psycopg2; c=psycopg2.connect(os.environ['VAAET_DATABASE_ADMIN_URL'].replace('postgresql+psycopg2://','postgresql://')); c.autocommit=True; c.cursor().execute(pathlib.Path('migrations/provision-roles.sql').read_text()); c.close()"
          VAAET_EXPECT_LEGACY_FIXTURE=0 VAAET_DATABASE_ADMIN_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/vaaet_fresh pytest tests/integration -v --tb=short -m postgres

  dvc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar DVC
        run: pip install "dvc[gdrive]>=3.50.0"

      - name: Verificar configuración de DVC
        run: |
          echo "=== DVC Version ==="
          dvc version
          dvc doctor
          echo "=== Remotes ==="
          dvc remote list
          echo "=== Status ==="
          dvc status
          echo "✅ Configuración de DVC verificada"
