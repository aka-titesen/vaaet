# ─────────────────────────────────────────────────────────────
# VAAET — Pipeline de Integración Continua
# Se activa en cada push y pull request a main.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision,training,visualization,database,dev]"

      - name: Verificar dependencias e imports
        run: |
          pip check
          python -c "import cv2, imblearn, joblib, numpy, pandas, psycopg2, sklearn, sqlalchemy, tensorflow, ultralytics"

      - name: Ejecutar Ruff
        run: ruff check src tests scripts

      - name: Ejecutar tests
        run: pytest -v --tb=short -x

      - name: Verificar compilación de notebooks
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for nb in pathlib.Path('notebooks').rglob('*.ipynb'):
              import json
              cells = json.loads(nb.read_text(encoding='utf-8'))['cells']
              for i, cell in enumerate(cells):
                  if cell['cell_type'] == 'code':
                      src = ''.join(cell['source'])
                      try:
                          ast.parse(src)
                      except SyntaxError as e:
                          errors.append(f'{nb}:cell {i}: {e}')
          if errors:
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los notebooks compilan correctamente')
          "

      - name: Rechazar binarios ML versionados por Git
        run: |
          python -c "
          import pathlib, subprocess, sys
          forbidden = {'.pt', '.keras', '.joblib', '.h5'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in tracked if pathlib.Path(p).suffix.lower() in forbidden]
          print('Binarios ML versionados:', bad)
          sys.exit(bool(bad))
          "

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar enlaces internos en documentación
        run: |
          python -c "
          import pathlib, re, sys
          errors = []
          root = pathlib.Path('.')
          for md in root.rglob('*.md'):
              normalized = md.as_posix()
              if '.git' in normalized or 'plantillas_docs' in normalized:
                  continue
              content = md.read_text(encoding='utf-8', errors='replace')
              links = re.findall(r'\[.*?\]\((?!http)(.*?)\)', content)
              for link in links:
                  clean = link.split('#')[0].split('?')[0]
                  if not clean:
                      continue
                  target = (md.parent / clean).resolve()
                  if not target.exists():
                      errors.append(f'{md}: enlace roto → {clean}')
          if errors:
              print('Enlaces rotos encontrados:')
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los enlaces internos son válidos')
          "

  dvc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar DVC
        run: pip install "dvc[gdrive]>=3.50.0"

      - name: Verificar configuración de DVC
        run: |
          echo "=== DVC Version ==="
          dvc version
          dvc doctor
          echo "=== Remotes ==="
          dvc remote list
          echo "=== Status ==="
          dvc status
          echo "✅ Configuración de DVC verificada"
