[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vaaet"
version = "3.0.0"
description = "Video Advanced Analysis of Traffic — Sistema de análisis vehicular avanzado para el Puente Gral. Manuel Belgrano"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Facundo Nicolás González"},
]
keywords = ["traffic-analysis", "computer-vision", "yolo", "mlops", "colab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
perception = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
]
intelligence = [
    "tensorflow>=2.15.0",
    "imbalanced-learn>=0.11.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
dvc = [
    "dvc>=3.50.0",
    "dvc-gdrive>=3.0.0",
]
# Instalar todo: pip install -e ".[perception,intelligence,viz,dev,dvc]"
all = [
    "vaaet[perception,intelligence,viz,dev,dvc]",
]

[project.urls]
Repository = "https://github.com/zgfnicolas/vaaet"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
"*" = ["*.md"]
