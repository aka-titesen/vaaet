# ─────────────────────────────────────────────────────────────
# VAAET — Pipeline de Integración Continua
# Se activa en cada push y pull request a main.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Instalar dependencias de percepción e inteligencia para tests completos
          pip install -e ".[all]"

      - name: Ejecutar linter básico
        run: python -m py_compile src/__init__.py

      - name: Ejecutar tests
        run: pytest tests/ -v --tb=short -x

      - name: Verificar compilación de notebooks
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for nb_dir in ['notebooks/01_data_prep', 'notebooks/02_production']:
              for nb in pathlib.Path(nb_dir).glob('*.ipynb'):
                  import json
                  cells = json.loads(nb.read_text())['cells']
                  for i, cell in enumerate(cells):
                      if cell['cell_type'] == 'code':
                          src = ''.join(cell['source'])
                          try:
                              ast.parse(src)
                          except SyntaxError as e:
                              errors.append(f'{nb}:cell {i}: {e}')
          if errors:
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los notebooks compilan correctamente')
          "

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar enlaces internos en documentación
        run: |
          python -c "
          import pathlib, re, sys
          errors = []
          root = pathlib.Path('.')
          for md in root.rglob('*.md'):
              if '.git' in str(md) or 'plantillas_docs' in str(md):
                  continue
              content = md.read_text(errors='replace')
              links = re.findall(r'\[.*?\]\((?!http)(.*?)\)', content)
              for link in links:
                  clean = link.split('#')[0].split('?')[0]
                  if not clean:
                      continue
                  target = (md.parent / clean).resolve()
                  if not target.exists():
                      errors.append(f'{md}: enlace roto → {clean}')
          if errors:
              print('Enlaces rotos encontrados:')
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los enlaces internos son válidos')
          "

  dvc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar DVC
        run: pip install "dvc[gdrive]>=3.50.0"

      - name: Verificar configuración de DVC
        run: |
          echo "=== DVC Version ==="
          dvc version
          echo "=== Remotes ==="
          dvc remote list
          echo "=== Status ==="
          dvc status || true
          echo "✅ Configuración de DVC verificada"
