[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaaet-ml"
version = "4.5.3"
description = "Video Advanced Analysis of Traffic — Sistema de análisis vehicular avanzado para el Puente Gral. Manuel Belgrano"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Facundo Nicolás González"},
]
keywords = ["traffic-analysis", "computer-vision", "yolo", "mlops", "colab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<3",
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
vision = [
    "ultralytics-opencv-headless>=8.3,<9",
]
training = [
    "tensorflow>=2.19,<2.21; python_version < '3.13'",
    "tensorflow>=2.20,<2.21; python_version >= '3.13'",
    "imbalanced-learn>=0.13,<1",
]
database = [
    "sqlalchemy>=2,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
]
visualization = [
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "ipywidgets>=8.1,<9",
]
dev = [
    "alembic>=1.14,<2",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.0",
]
dvc = [
    "dvc>=3.50.0",
    "dvc-gdrive>=3.0.0",
]

[project.urls]
Repository = "https://github.com/zgfnicolas/vaaet"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vaaet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "postgres: requires a live PostgreSQL integration database",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
"*" = ["*.md"]
